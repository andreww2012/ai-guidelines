# Makes changesets name git tags like `<package name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
# Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: # []
  - eslint-plugin-github-action@0.5.0
  - knip@6.45.1
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    # `http-cache-semantics` from `eslint-config-un` has no patched version yet
    - GHSA-ch52-4w7c-c8xp
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 && < 1'
