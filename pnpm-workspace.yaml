# Makes changesets name git tags like `<package name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
# Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: # []
  - eslint-plugin-github-action@0.5.0
  - knip@6.45.1
  - '@cspell/cspell-bundled-dicts@10.5.1'
  - '@cspell/cspell-json-reporter@10.5.1'
  - '@cspell/cspell-performance-monitor@10.5.1'
  - '@cspell/cspell-pipe@10.5.1'
  - '@cspell/cspell-resolver@10.5.1'
  - '@cspell/cspell-service-bus@10.5.1'
  - '@cspell/cspell-types@10.5.1'
  - '@cspell/cspell-worker@10.5.1'
  - '@cspell/dynamic-import@10.5.1'
  - '@cspell/filetypes@10.5.1'
  - '@cspell/rpc@10.5.1'
  - '@cspell/strong-weak-map@10.5.1'
  - '@cspell/url@10.5.1'
  - cspell-config-lib@10.5.1
  - cspell-dictionary@10.5.1
  - cspell-gitignore@10.5.1
  - cspell-glob@10.5.1
  - cspell-grammar@10.5.1
  - cspell-io@10.5.1
  - cspell-lib@10.5.1
  - cspell-trie-lib@10.5.1
  - cspell@10.5.1
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    # `http-cache-semantics` from `eslint-config-un` has no patched version yet
    - GHSA-ch52-4w7c-c8xp
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 && < 1'
