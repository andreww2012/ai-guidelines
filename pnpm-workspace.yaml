# Makes changesets name git tags like `<package name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
# Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: []
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

audit:
  ignore: # []
    # `http-cache-semantics` from `eslint-config-un` has no patched version yet
    - GHSA-ch52-4w7c-c8xp
    # `picomatch` from dev tools has no patched version yet
    # cspell:disable-next-line
    - GHSA-fc5q-39xc-vjpf
  ignorePrune: true

allowBuilds:
  lefthook@2.2.4: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-plugin-markdown-preferences@0.43.0>@eslint/markdown: '>=7.4.0'
