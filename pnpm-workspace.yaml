# `ncu` only updates catalogs in workspace mode, which needs this
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: # []
  - eslint-config-un@1.0.0-rc.5
  - eslint-plugin-jsdoc@65.3.8
  - eslint@10.13.0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    - GHSA-ch52-4w7c-c8xp # `http-cache-semantics` from `eslint-config-un` has no patched version yet
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

catalogs:
  format:
    oxfmt: 0.71.0
