name: Check code (+ Publish)
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  actions-lock:
    name: Actions lockfile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm knip

  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm check:spelling

  formatting:
    name: Formatting check (oxfmt)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm check:format

  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm ts

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm eslint

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: install
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm test:vitest

  build:
    name: Build (tsdown) & lint package (attw, publint)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
      - run: pnpm build

  release-main:
    name: Create release PR _OR_ Publish on merge
    needs:
      - actions-lock
      - knip
      - spellcheck
      - formatting
      - typecheck
      - eslint
      - test
      - build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/prepare
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        env:
          # For the changelog generator, the action passes it on its own
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exits with 1 if there are no unreleased changesets,
          # in which case the version stays the same
          pnpm changeset version || true
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
          # `changeset version` may also create new files (like `CHANGELOG.md` on the first release)
          git clean -fdq
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: 'chore: release v${{ env.NEW_VERSION }}'
          commit-message: 'chore: release v${{ env.NEW_VERSION }}'
